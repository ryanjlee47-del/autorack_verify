# CI for Autorack Verify.
#
# Four gates, in increasing order of how long they take to fail: lint,
# format, types, tests. Ordering them this way means a misplaced import is
# reported in ~20 seconds instead of after a two-minute test run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's result
# irrelevant. Cancelling it frees a runner instead of burning minutes on an
# answer nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Node is NOT optional here, despite being absent from
      # requirements-dev.txt (it is not a Python dependency).
      # tests/test_hash_parity.py, test_outbox_js.py and test_sw_js.py all
      # call pytest.skip() when `node` is missing rather than failing. That
      # is right for a contributor's laptop and wrong for CI: the parity
      # tests are what prove static/js/barcode.js and barcode.py produce
      # byte-identical keys, and a divergence there bills warehouses for
      # phantom rejects. Without this step CI would go green while the
      # single most important guarantee in the codebase went unchecked.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Format (ruff)
        run: ruff format --check .

      - name: Types (mypy)
        run: mypy

      - name: Tests (pytest)
        # -p no:randomly is not needed (tests are order-independent), but
        # --strict-markers catches a typo'd @pytest.mark before it silently
        # deselects a test.
        run: pytest -q --strict-markers

      # The parity tests skip rather than fail when node is missing, so a
      # broken setup-node step upstream would not turn CI red on its own.
      # This asserts they actually executed.
      - name: Assert JS parity tests were not skipped
        run: |
          pytest tests/test_hash_parity.py tests/test_index_parity.py \
                 tests/test_outbox_js.py tests/test_sw_js.py tests/test_app_js.py \
                 -q --no-header -rs 2>&1 | tee /tmp/parity.txt
          if grep -q "skipped" /tmp/parity.txt; then
            echo "::error::JS parity tests were skipped -- node.js is unavailable."
            exit 1
          fi

      # Catch a migration that landed without the diagram being
      # regenerated.
      #
      # This compares the introspected *schema*, not the PNG. PNG bytes are
      # not reproducible across machines: the render depends on which
      # DejaVu build is installed (generate_erd._load_fonts falls back to a
      # bitmap font when there is none) and on the Pillow version's
      # encoder, so a byte comparison would fail here for reasons that have
      # nothing to do with the schema. docs/schema.json is what the diagram
      # is derived from and is stable anywhere Python and SQLite run.
      - name: Docs (ERD reflects the current schema)
        run: |
          python tools/generate_erd.py --dump-schema /tmp/schema.json
          diff -u docs/schema.json /tmp/schema.json || {
            echo "::error::Schema changed without regenerating the ERD."
            echo "Run: python tools/generate_erd.py && python tools/generate_erd.py --dump-schema docs/schema.json"
            exit 1
          }

  audit:
    # Separated from `check` so a newly-disclosed CVE in a pinned
    # dependency does not block an unrelated pull request from merging.
    # It still turns the branch red, which is the point.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt
