# CI: backend (lint, types, migrations, tests on real Postgres, JS/Python
# engine parity) and frontend (node unit tests). Fastest-failing gates first.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autorack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/autorack_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/autorack_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # Node is required, not optional: test_js_parity.py proves the phone's
      # matching engine agrees with the server's, and skips without node.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy
      - name: Migrations match models
        run: alembic upgrade head && alembic check
      - name: Tests
        run: pytest -q
      - name: Assert JS parity tests ran
        run: |
          pytest tests/test_js_parity.py -q -rs | tee /tmp/parity.txt
          if grep -q skipped /tmp/parity.txt; then
            echo "::error::JS parity tests were skipped (node unavailable)"; exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: npm test
      - name: Syntax check every module
        run: for f in $(find . -name '*.js' -not -path './w/vendor/*'); do node --check "$f"; done
      - name: Pages build script
        run: AUTORACK_API_BASE=https://api.example.com sh build.sh && grep -q "https://api.example.com" config.js _headers

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1 && pip-audit -r backend/requirements.txt
