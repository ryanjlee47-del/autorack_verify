{% extends "owner_base.html" %}
{% block title %}Prepare a shift -- Autorack Verify{% endblock %}
{% block content %}
<h1>Prepare a shift</h1>
<div class="card">
  {% if not manifests %}
    <div class="empty-state">Upload and commit a manifest first.</div>
  {% else %}
  <form method="post" action="/shifts/prepare">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-field">
      <label for="label">Shift label</label>
      <input type="text" id="label" name="label" required placeholder="e.g. Morning shift">
    </div>
    <div class="form-field">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" required value="{{ today }}">
    </div>
    <div class="form-field">
      <label>Manifests to include</label>
      {% for m in manifests %}
        <label style="font-weight:400; display:block;">
          <input type="checkbox" name="manifest_ids" value="{{ m.id }}"> {{ m.ref }} ({{ m.line_count }} lines)
        </label>
      {% endfor %}
    </div>
    <button class="btn" type="submit">Prepare shift + print QR</button>
  </form>
  {% endif %}
</div>
{% endblock %}
