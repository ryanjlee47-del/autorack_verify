<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Scan -- Autorack Verify</title>
  <link rel="manifest" href="/w/manifest.webmanifest">
  <meta name="theme-color" content="#14171a">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/worker.css">
</head>
<body data-session-id="{{ session_id }}" data-lang="{{ lang }}" data-worker-self-resolve="{{ 'true' if worker_self_resolve else 'false' }}">
  <div class="scan-screen">
    <video id="camera-video" autoplay playsinline muted></video>
    <canvas id="decode-canvas" style="display:none"></canvas>

    <div class="reticle"><div class="reticle-box"></div></div>

    <div class="camera-off-panel" id="camera-off-panel" style="display:none">
      <p id="camera-off-title"></p>
      <p class="hint" id="camera-off-hint"></p>
    </div>

    <div class="header-chip">
      <span id="bundle-info"></span>
      <span class="header-right">
        <span id="camera-countdown" class="camera-countdown" style="display:none"></span>
        <button id="logout-button" class="link-button"></button>
      </span>
    </div>

    <div class="scan-controls">
      <button id="manual-entry-toggle" class="icon-button" aria-label="Type barcode manually">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6" width="18" height="12" rx="2"/>
          <path d="M7 10h.01M11 10h.01M15 10h.01M17 10h.01M7 14h10"/>
        </svg>
      </button>
      <button id="camera-toggle" class="icon-button" title="Turn camera on or off" aria-label="Toggle camera">
        <svg class="icon-camera-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
          <circle cx="12" cy="13.5" r="3.4"/>
        </svg>
        <svg class="icon-camera-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
          <circle cx="12" cy="13.5" r="3.4"/>
          <line x1="3" y1="3" x2="21" y2="21"/>
        </svg>
      </button>
      <button id="torch-toggle" class="icon-button" title="Torch" aria-label="Toggle torch" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/>
        </svg>
      </button>
    </div>

    <input id="wedge-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">

    <div class="result-overlay" id="result-overlay">
      <div class="result-label" id="result-label"></div>
      <div class="result-detail" id="result-detail"></div>
      <div class="result-sku mono" id="result-sku"></div>
      <div class="result-actions">
        <button class="dismiss-button appeal-button" id="appeal-open-button" style="display:none"></button>
        <button class="dismiss-button" id="dismiss-button" style="display:none"></button>
      </div>
    </div>

    <div class="modal-overlay" id="manual-entry-modal" style="display:none">
      <div class="modal-card">
        <h2 id="manual-entry-title"></h2>
        <input type="text" id="manual-entry-input" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false">
        <div class="modal-actions">
          <button id="manual-entry-cancel" class="btn-secondary"></button>
          <button id="manual-entry-submit" class="btn"></button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="appeal-modal" style="display:none">
      <div class="modal-card">
        <h2 id="appeal-modal-title"></h2>
        <p class="modal-hint" id="appeal-instructions"></p>
        <input type="file" id="appeal-photo-input" accept="image/*" capture="environment" style="display:none">
        <img id="appeal-photo-preview" style="display:none;">
        <button id="appeal-take-photo-button" class="btn-secondary" style="width:100%;"></button>
        <textarea id="appeal-note-input" rows="2"></textarea>
        <div class="modal-actions">
          <button id="appeal-cancel-button" class="btn-secondary"></button>
          <button id="appeal-submit-button" class="btn" disabled></button>
        </div>
      </div>
    </div>

    <div class="summary-overlay" id="summary-overlay" style="display:none">
      <h2 id="summary-title"></h2>
      <div class="summary-stats" id="summary-stats"></div>
      <button id="summary-done-button" class="btn"></button>
    </div>
  </div>

  <script src="/static/js/barcode.js"></script>
  <script src="/static/js/vendor/zxing.min.js"></script>
  <script src="/static/js/worker/i18n.js"></script>
  <script src="/static/js/worker/idb.js"></script>
  <script src="/static/js/worker/feedback.js"></script>
  <script src="/static/js/worker/scanner.js"></script>
  <script src="/static/js/worker/outbox.js"></script>
  <script src="/static/js/worker/appeals.js"></script>
  <script src="/static/js/worker/app.js"></script>
</body>
</html>
