<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#ffffff">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Proof of shipment · Autorack</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/config.js"></script>
  <script type="module" src="/assets/js/proof.js"></script>
</head>
<body class="proof-page">
  <header class="site-nav">
    <div class="container nav-inner">
      <a class="lockup site-brand" href="/" aria-label="Autorack home">
        <img class="lockup-mark" src="/assets/brand/mark.svg" alt="" width="30" height="30">
        <span class="lockup-text"><span class="lockup-word">AUTORACK</span><span class="lockup-tag">VERIFIED LOGISTICS</span></span>
      </a>
      <div class="nav-actions">
        <button class="btn" id="print-btn" type="button">Print</button>
      </div>
    </div>
  </header>
  <main class="container proof-main" id="proof">
    <p class="muted">Loading…</p>
  </main>
  <footer class="proof-foot container">
    <p class="muted small">Every unit was checked by barcode against the order before packing, with <a href="/">Autorack</a> pick verification. Times are the warehouse's local time.</p>
  </footer>
</body>
</html>
