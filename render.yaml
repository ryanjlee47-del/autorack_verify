# Render Blueprint: one Docker web service that serves the API *and* the
# frontend (dashboard, worker app, landing page). The database is Neon: paste
# its pooled connection string into DATABASE_URL. See docs/DEPLOYMENT.md.
#
# plan: free sleeps after ~15 minutes idle and takes 30-60 s to wake. Fine for
# trials and pilots (phones queue scans offline anyway). Change to `starter`
# (about $7/month) when customers depend on it.
services:
  - type: web
    name: autorack
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SERVE_FRONTEND
        value: "true"
      - key: EMAIL_BACKEND
        value: resend
      - key: EMAIL_FROM
        value: "Autorack <onboarding@resend.dev>"
      - key: RESEND_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: OPERATOR_EMAILS
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: AGREEMENT_COUNTERSIGNER_NAME
        sync: false
      - key: AGREEMENT_COUNTERSIGNER_TITLE
        sync: false
      # Sign in with Google (required): see docs/DEPLOYMENT.md section 10.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Where the CSV drop URL points (the API's own address).
      - key: API_PUBLIC_URL
        sync: false
      # Optional import-by-email; see docs/DEPLOYMENT.md section 9.
      - key: INBOUND_EMAIL_ADDRESS
        sync: false
      - key: INBOUND_EMAIL_SECRET
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
